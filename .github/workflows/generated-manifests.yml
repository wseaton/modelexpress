# config/manifests is generated from the operator's Rust types. Nothing stops
# the two drifting apart on its own, and a stale CRD is invisible until a CR
# is rejected on a cluster.
#
# Run with the default --image so the committed tree is reproduced exactly;
# passing a release digest here would report drift on every run.

name: Generated Manifests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  generated-manifests:
    name: config/manifests is current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-xtask-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-xtask-
            ${{ runner.os }}-cargo-

      # protoc: xtask reads the CRD types from modelexpress-server, which pulls
      # modelexpress-common and runs tonic-build at compile time
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev

      - name: Check CRDs
        run: cargo run --package xtask -- crdgen --check

      - name: Check deploy manifests
        run: cargo run --package xtask -- manifests --check

      - name: Check overlays build
        run: ./ci/check-manifest-overlays.sh
