syntax = "proto3";

package model_express.p2p;

// P2P Metadata Service for coordinating NIXL/RDMA transfers between vLLM instances.
// The server stores model metadata keyed by mx_source_id (a hash of SourceIdentity).
// Clients query for existing sources and publish their own metadata.
service P2pService {
  // Publish model metadata - called by client after loading model weights
  rpc PublishMetadata(PublishMetadataRequest) returns (PublishMetadataResponse);

  // List available source workers - lightweight, no tensor metadata.
  // Returns one SourceInstanceRef per worker; clients filter by worker_rank
  // to find matching peers and then call GetMetadata for the chosen one.
  rpc ListSources(ListSourcesRequest) returns (ListSourcesResponse);

  // Fetch full tensor metadata for one specific worker (MB-scale).
  // Call this after filtering ListSources results by worker_rank.
  rpc GetMetadata(GetMetadataRequest) returns (GetMetadataResponse);

  // Update source status - called by source after NIXL registration and warmup
  rpc UpdateStatus(UpdateStatusRequest) returns (UpdateStatusResponse);

  // Compute a multi-peer transfer plan for parallel weight downloads.
  // The server selects eligible peers, spreads tensors across them, and
  // returns per-peer assignments with NIXL metadata inlined so the client
  // needs no follow-up RPCs.
  rpc ComputeTransferPlan(ComputeTransferPlanRequest) returns (ComputeTransferPlanResponse);

  // Advertise this worker's owned-tensor inventory for planning.
  //
  // Lightweight catalog (name + dtype + byte_len + optional shape; no GPU
  // addresses) used by the planner to match peers that own a needed tensor.
  // Required for models where peers may own disjoint shards (MoE with
  // expert-parallel, asymmetric quantization variants, etc.), since the
  // server cannot derive ownership from SourceIdentity alone.
  //
  // Sent once per peer after the model is loaded and before the peer is
  // considered eligible for transfer planning. Receivers also call this
  // before requesting a plan (with an empty entries list) so the planner
  // can diff what the receiver has against what peers own; receivers then
  // re-advertise the populated catalog after the transfer completes so
  // they can serve future requesters.
  //
  // Re-sending replaces the previous catalog for (mx_source_id, worker_id)
  // iff the new generation is higher. The lease expires with the worker's
  // heartbeat (same lifecycle as PublishMetadata).
  rpc AdvertiseTensorCatalog(AdvertiseTensorCatalogRequest) returns (AdvertiseTensorCatalogResponse);
}

// ============================================================================
// Source Identity
// ============================================================================

// Inference backend framework
enum BackendFramework {
  BACKEND_FRAMEWORK_UNKNOWN = 0;
  BACKEND_FRAMEWORK_VLLM = 1;
  BACKEND_FRAMEWORK_SGLANG = 2;
  BACKEND_FRAMEWORK_TRT_LLM = 3;
}

// Type of tensors the source is serving
enum MxSourceType {
  MX_SOURCE_TYPE_WEIGHTS = 0;    // Base model weights (default)
  MX_SOURCE_TYPE_LORA = 1;       // LoRA adapter weights
  MX_SOURCE_TYPE_CUDA_GRAPH = 2; // CUDA graph artifacts
}

// All fields that affect weight tensor layout and transfer compatibility.
// The server computes SHA256(canonical_json(identity)) and takes the first
// 16 hex chars as the mx_source_id used to key metadata storage.
message SourceIdentity {
  // ModelExpress version (e.g., "0.3.0"). Ensures format compatibility across upgrades.
  string mx_version = 1;

  // Type of tensors being served
  MxSourceType mx_source_type = 2;

  // Model name (e.g., "deepseek-ai/DeepSeek-V3")
  string model_name = 3;

  // Inference framework
  BackendFramework backend_framework = 4;

  // Tensor parallel degree
  uint32 tensor_parallel_size = 5;

  // Pipeline parallel degree
  uint32 pipeline_parallel_size = 6;

  // Expert parallel degree (MoE models)
  uint32 expert_parallel_size = 7;

  // Weight dtype (e.g., "bfloat16", "float8_e4m3fn")
  string dtype = 8;

  // Quantization method (e.g., "fp8", "awq", "gptq", or empty)
  string quantization = 9;

  // Escape hatch for framework-specific config
  map<string, string> extra_parameters = 10;

  // Content-addressed revision of the model weights (e.g., HuggingFace
  // commit SHA, S3 object version, or any deployer-provided version
  // string). When populated, two sources with identical SourceIdentity
  // are guaranteed to have bit-identical weight bytes, which lets
  // decentralized modes (no central coordinator) use mx_source_id as a
  // full content check. Empty string means "unknown revision" and is
  // compatible with older publishers that pre-date this field.
  string revision = 11;
}

// ============================================================================
// Tensor Descriptors
// ============================================================================

message TensorDescriptor {
  // Tensor name (e.g., "model.layers.0.self_attn.q_proj.weight")
  string name = 1;

  // GPU memory address
  uint64 addr = 2;

  // Size in bytes
  uint64 size = 3;

  // GPU device ID (0-7 for 8-GPU setup)
  uint32 device_id = 4;

  // Data type (e.g., "float16", "bfloat16")
  string dtype = 5;
}

// ============================================================================
// Worker Metadata
// ============================================================================

// Source lifecycle status
enum SourceStatus {
  SOURCE_STATUS_UNKNOWN = 0;        // uninitialized (proto3 zero default)
  SOURCE_STATUS_INITIALIZING = 1;  // publishing metadata
  SOURCE_STATUS_READY = 2;         // ready for transfers
  SOURCE_STATUS_STALE = 3;         // source gone, metadata may be stale
}

message WorkerMetadata {
  // Worker rank (GPU index within the instance)
  uint32 worker_rank = 1;

  // Backend-specific metadata for establishing transfers.
  // NIXL: serialized agent metadata for RDMA connections.
  // TransferEngine: Mooncake session ID ("ip:port").
  oneof backend_metadata {
    bytes nixl_metadata = 2;
    string transfer_engine_session_id = 10;
  }

  // Tensor descriptors for this worker's GPU
  repeated TensorDescriptor tensors = 3;

  // Worker lifecycle status
  SourceStatus status = 4;

  // Timestamp of last status update (unix millis)
  int64 updated_at = 5;

  // P2P metadata exchange fields (opt-in via MX_P2P_METADATA=1).
  // When populated, targets fetch NIXL metadata and tensor manifests
  // directly from the source worker instead of from the central server.

  // host:port where NIXL listen thread accepts incoming metadata fetches
  string metadata_endpoint = 6;

  // NIXL agent name (used by targets to identify the remote agent)
  string agent_name = 7;

  // host:port for the worker's gRPC WorkerService (tensor manifest)
  string worker_grpc_endpoint = 8;

  // Free-form key/value labels describing this worker's external
  // identity. Used by the planner's external-data informers to join
  // MX workers against signals tagged by deployer-meaningful keys
  // (e.g. `pod`, `namespace`, `node`, `rack`, `region`).
  //
  // Conventionally lowercase keys. Keys are not interpreted by the
  // server; informers declare which key they consume. Empty map is
  // valid and means "no external identity advertised" — informers
  // that require a label treat the peer as missing data (apply their
  // unknown-policy).
  map<string, string> labels = 9;
}

// ============================================================================
// Worker Service (P2P tensor manifest exchange)
// ============================================================================

// Per-worker gRPC service for direct tensor manifest retrieval.
// Sources start this service when MX_P2P_METADATA=1. Targets call
// GetTensorManifest to fetch tensor descriptors directly from the
// source worker instead of from the central metadata server.
service WorkerService {
  rpc GetTensorManifest(GetTensorManifestRequest) returns (GetTensorManifestResponse);
}

message GetTensorManifestRequest {
  // mx_source_id for validation (catches stale discovery)
  string mx_source_id = 1;
}

message GetTensorManifestResponse {
  repeated TensorDescriptor tensors = 1;
  // Echoed mx_source_id for confirmation
  string mx_source_id = 2;

  // Self-describing worker info, populated so a single GetTensorManifest
  // round-trip is enough to open a NIXL transfer. Required for deployments
  // with no central coordinator (e.g., decentralized, K8s-Service-routed)
  // where the caller never saw a ListSources/GetMetadata response.

  // host:port of this worker's NIXL listen thread
  string metadata_endpoint = 3;

  // NIXL agent name for the serving worker
  string agent_name = 4;

  // Rank of the serving worker (for rank-matched transfers)
  uint32 worker_rank = 5;
}

// ============================================================================
// Publish Metadata
// ============================================================================

message PublishMetadataRequest {
  // Source identity — the server computes mx_source_id from this
  SourceIdentity identity = 1;

  // Metadata for this worker (one call per worker)
  WorkerMetadata worker = 2;

  // Unique identifier for this running instance (UUID).
  // Differentiates multiple replicas with identical SourceIdentity.
  // If empty, the server rejects the request.
  string worker_id = 3;
}

message PublishMetadataResponse {
  bool success = 1;
  string message = 2;
  // Computed 16-char hex key returned to client for use in subsequent calls
  string mx_source_id = 3;
  // Echoed worker_id for confirmation
  string worker_id = 4;
}

// ============================================================================
// List Sources
// ============================================================================

// Reference to one worker in one available source instance (lightweight — no tensor metadata).
// One entry is emitted per worker, so clients can match on worker_rank without calling GetMetadata.
message SourceInstanceRef {
  // Computed 16-char hex source ID
  string mx_source_id = 1;

  // Unique identifier for this running instance
  string worker_id = 2;

  // Human-readable model name
  string model_name = 3;

  // Global rank of this worker within the instance.
  // Clients filter on this field to find a peer with a matching rank.
  uint32 worker_rank = 4;
}

message ListSourcesRequest {
  // Filter by source identity — server computes mx_source_id.
  // If not set, instances across all sources are returned.
  SourceIdentity identity = 1;

  // Filter by worker status. Not set = return workers in all statuses.
  optional SourceStatus status_filter = 2;
}

message ListSourcesResponse {
  repeated SourceInstanceRef instances = 1;
}

// ============================================================================
// Get Metadata
// ============================================================================

message GetMetadataRequest {
  // mx_source_id from a ListSourcesResponse or PublishMetadataResponse
  string mx_source_id = 1;

  // worker_id from a ListSourcesResponse or PublishMetadataResponse
  string worker_id = 2;
}

message GetMetadataResponse {
  // Whether the requested worker was found
  bool found = 1;

  // Metadata for the requested worker (MB-scale; only fetched on demand)
  WorkerMetadata worker = 2;

  // Echoed mx_source_id
  string mx_source_id = 3;

  // Echoed worker_id
  string worker_id = 4;
}

// ============================================================================
// Status Coordination
// ============================================================================

message UpdateStatusRequest {
  // mx_source_id returned from PublishMetadata
  string mx_source_id = 1;

  // Worker rank (GPU index)
  uint32 worker_rank = 2;

  // New status
  SourceStatus status = 3;

  // worker_id returned from PublishMetadata
  string worker_id = 4;
}

message UpdateStatusResponse {
  bool success = 1;
  string message = 2;
}

// ============================================================================
// Transfer Planning
// ============================================================================

message ComputeTransferPlanRequest {
  // Source identity for the model to transfer
  SourceIdentity identity = 1;

  // Rank of the requesting worker (only peers with matching rank are eligible)
  uint32 requester_worker_rank = 2;

  // Worker ID of the requester (excluded from peer candidates)
  string requester_worker_id = 3;

  // Maximum number of peers to include in the plan. Server may cap lower.
  // If not set, the server uses all eligible peers.
  optional uint32 max_peers = 4;

  // Optional explicit list of tensor names the requester needs.
  //
  // If populated, the planner restricts assignments to this set.
  // If empty, the planner uses the requester's own advertised catalog
  // (from a prior AdvertiseTensorCatalog call with the matching
  // worker_id) as the implied need-set. Falling back to the union of
  // all peers' catalogs is a last resort and the planner returns it in
  // PlanDiagnostics.note for visibility.
  repeated string requested_tensor_names = 5;
}

// One peer's assignment in a transfer plan.
// Contains everything the client needs to initiate an RDMA transfer
// without any follow-up RPCs.
message PeerAssignment {
  // Source ID for this peer
  string mx_source_id = 1;

  // Unique worker instance identifier
  string worker_id = 2;

  // NIXL agent name for remote identification
  string agent_name = 3;

  // host:port where NIXL listen thread accepts metadata fetches
  string metadata_endpoint = 4;

  // Serialized NIXL agent metadata for RDMA connection setup
  bytes nixl_metadata = 5;

  // Full tensor descriptors for this peer (addresses, sizes, dtypes)
  repeated TensorDescriptor tensors = 6;

  // Subset of tensor names this peer should serve in the transfer.
  // The union of assigned_tensor_names across all peers covers the
  // full model; each tensor appears in exactly one peer's assignment.
  repeated string assigned_tensor_names = 7;

  // host:port for the worker's gRPC WorkerService (tensor manifest)
  string worker_grpc_endpoint = 8;
}

// Diagnostic information about how the plan was computed.
message PlanDiagnostics {
  // Total candidate workers discovered for this source/rank
  uint32 candidates_total = 1;

  // Candidates that passed eligibility filters
  uint32 candidates_eligible = 2;

  // Human-readable summary of the planning decision
  string note = 3;
}

message ComputeTransferPlanResponse {
  // Per-peer transfer assignments. Empty if no eligible peers exist.
  repeated PeerAssignment peers = 1;

  // How the plan was computed (always populated)
  PlanDiagnostics diagnostics = 2;

  // Tensors the requester asked for that no eligible peer owned.
  // The requester is expected to load these from disk (or skip them
  // if they were already present locally).
  repeated string uncovered_tensor_names = 3;
}

// ============================================================================
// Tensor Catalog (planning inventory)
// ============================================================================

// One owned-tensor entry in a peer's catalog. Lighter than TensorDescriptor:
// no GPU address (those flow through GetTensorManifest at transfer time).
message TensorCatalogEntry {
  // Fully-qualified tensor name. Required. For MoE this includes the
  // expert index, e.g. "model.layers.42.mlp.experts.7.w1.weight".
  string name = 1;

  // Byte length of this tensor as owned by this peer.
  uint64 byte_len = 2;

  // Data type string. The planner verifies that peers serving the same
  // name agree on dtype and rejects the request if they diverge.
  string dtype = 3;

  // Optional shape. Used for cross-peer validation (e.g., catching
  // accidental shape divergence in elastic-EP shuffles); the planner
  // does not require it. Empty means "unspecified".
  repeated int64 shape = 4;
}

message AdvertiseTensorCatalogRequest {
  // Source identity; the server derives mx_source_id and restricts
  // catalog scope to peers with the same key.
  SourceIdentity identity = 1;

  // Worker that owns these tensors. Must match a prior PublishMetadata
  // worker_id for the same identity, or the call is rejected.
  string worker_id = 2;
  uint32 worker_rank = 3;

  // Full owned-tensor inventory at this generation. Each name must be
  // unique within entries. An empty list is valid (the receiver-side
  // pre-plan advertise pattern).
  repeated TensorCatalogEntry entries = 4;

  // Monotonic generation counter. The server keeps only the highest
  // generation per (mx_source_id, worker_id) and rejects stale writes.
  // Bump when expert routing or shard layout changes mid-run.
  uint64 generation = 5;
}

message AdvertiseTensorCatalogResponse {
  bool success = 1;
  string message = 2;
  // Echoed totals for client-side sanity check.
  uint32 entries_accepted = 3;
  uint64 total_bytes = 4;
  // Generation the server now holds (>= the request's generation).
  uint64 generation = 5;
}
