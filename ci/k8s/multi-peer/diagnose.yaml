# One-shot diagnostic pod: prints whether the modelexpress vLLM plugin is
# actually installed and registered inside the worker image. Apply with the
# same WORKER_IMAGE used by source.yaml / target.yaml:
#
#   WORKER_IMAGE=quay.io/wseaton/mx-worker-vllm:dev \
#     envsubst < ci/k8s/multi-peer/diagnose.yaml | kubectl apply -n mx-test -f -
#   kubectl logs -n mx-test job/mx-diagnose -f
#   kubectl delete -n mx-test job/mx-diagnose
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mx-diagnose
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: diagnose
          image: ${WORKER_IMAGE}
          imagePullPolicy: Always
          command: ["bash", "-eu", "-o", "pipefail", "-c"]
          args:
            - |
              echo "===== 1. pip show modelexpress ====="
              pip show modelexpress || echo "NOT INSTALLED"
              echo
              echo "===== 2. modelexpress module path ====="
              python3 -c "import modelexpress, inspect; print(modelexpress.__file__)" \
                || echo "IMPORT FAILED"
              echo
              echo "===== 3. vllm.general_plugins entry points ====="
              python3 -c "from importlib.metadata import entry_points; \
                eps = list(entry_points(group='vllm.general_plugins')); \
                print('count:', len(eps)); \
                [print(' -', e.name, '=', e.value) for e in eps]"
              echo
              echo "===== 4. register_modelexpress_loaders() import + call ====="
              python3 -c "import modelexpress; modelexpress.register_modelexpress_loaders(); print('OK')"
              echo
              echo "===== 5. ask vLLM for the 'mx' loader ====="
              python3 -c "
              from vllm.config import LoadConfig
              from vllm.model_executor.model_loader import get_model_loader
              print(get_model_loader(LoadConfig(load_format='mx')))
              "
              echo
              echo "===== 6. vllm version ====="
              python3 -c "import vllm; print(vllm.__version__)"
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
