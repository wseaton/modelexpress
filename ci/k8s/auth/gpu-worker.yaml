#
# vLLM P2P worker for ci/k8s/auth/gpu-e2e.sh; applied as both source and target. Central
# metadata mode (no worker-to-worker hop), audience-scoped projected SA token.
#
# envsubst vars: JOB_NAME ROLE WORKER_IMAGE MX_CI_MODEL WORKER_PORT USE_PLAN DEADLINE
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: ${DEADLINE}
  template:
    metadata:
      labels:
        app: mx-p2p-worker
        role: ${ROLE}
    spec:
      restartPolicy: Never
      serviceAccountName: modelexpress
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: mx-p2p-worker
                topologyKey: kubernetes.io/hostname
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        # Bound, audience-scoped projected SA token the MX client presents to the server.
        - name: mx-token
          projected:
            sources:
              - serviceAccountToken:
                  path: modelexpress
                  audience: modelexpress-p2p
                  expirationSeconds: 3600
      containers:
        - name: ${JOB_NAME}
          image: ${WORKER_IMAGE}
          imagePullPolicy: Always
          command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - --model
            - "${MX_CI_MODEL}"
            - --load-format
            - mx
            - --tensor-parallel-size
            - "1"
            - --trust-remote-code
            - --port
            - "${WORKER_PORT}"
          env:
            - name: VLLM_PLUGINS
              value: "modelexpress"
            - name: MX_SERVER_ADDRESS
              value: "mx-server:8000"
            # Central metadata mode: no worker-to-worker WorkerService (which is plaintext).
            - name: MX_P2P_METADATA
              value: "0"
            - name: MX_USE_TRANSFER_PLAN
              value: "${USE_PLAN}"
            - name: MX_RDMA_NIC_PIN
              value: "auto"
            - name: MX_CONTIGUOUS_REG
              value: "0"
            - name: UCX_TLS
              value: "rc_x,rc,dc_x,dc,cuda_copy"
            - name: UCX_RNDV_SCHEME
              value: "get_zcopy"
            - name: UCX_RNDV_THRESH
              value: "0"
            - name: NIXL_LOG_LEVEL
              value: "INFO"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MX_LABEL_pod
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MX_LABEL_role
              value: "${JOB_NAME}"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: HF_TOKEN
          ports:
            - containerPort: ${WORKER_PORT}
              name: metrics
          resources:
            requests:
              cpu: "4"
              memory: "32Gi"
              nvidia.com/gpu: "1"
              rdma/ib: "1"
            limits:
              nvidia.com/gpu: "1"
              rdma/ib: "1"
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: mx-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
          securityContext:
            capabilities:
              add: [IPC_LOCK]
