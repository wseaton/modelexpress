[package]
name = "modelexpress-client"
description = "Client library for Model Express gRPC server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true

[dependencies]
modelexpress-common = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
colored = { workspace = true }
memmap2 = { workspace = true }
libc = { workspace = true }
nixl-sys = { workspace = true, features = ["stub-api"], optional = true }
blake3 = { workspace = true }

[dev-dependencies]
modelexpress-common = { workspace = true, features = ["test-support"] }
tokio-test = "0.4"
tonic-build = { workspace = true }
tempfile = "3.20"

[lints]
workspace = true

[[bin]]
name = "modelexpress-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "modelexpress-cache"
path = "src/bin/cache.rs"

[features]
# Enables the NIXL FFI transport (the stager/puller RDMA transfer legs). Off by
# default so the library, CLI, and unit tests build with no RDMA hardware or
# libnixl; the dedicated daemon image builds with it on.
nixl = ["dep:nixl-sys"]
# Exposes the in-process loopback transport (transfer::loopback) outside this
# crate's own unit tests, so server-side integration tests can drive the
# transfer protocol honestly (real bytes) against a real registry server. Test
# scaffolding only; never enabled in production builds.
test-support = []
