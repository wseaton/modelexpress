# Holder for the Rust spike: an init container (vLLM image, has huggingface-cli)
# downloads a real model to node-local NVMe; the slim daemon image then serves it
# via --role holder. __IMAGE__ is substituted by run.sh.
apiVersion: v1
kind: Pod
metadata:
  name: cached-holder
  namespace: weaton-dev
  labels: {app: cached-spike, role: holder}
  annotations:
    sidecar.istio.io/inject: "false"
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: gf48cf2
  initContainers:
    - name: fetch
      image: vllm/vllm-openai:v0.17.1
      command: ["bash", "-lc"]
      args:
        - |
          set -euo pipefail
          mkdir -p /scratch/model
          huggingface-cli download "$MODEL" --include "*.safetensors" \
            --local-dir /scratch/model
          echo "fetched: $(du -sh /scratch/model | cut -f1)"
      env:
        - name: MODEL
          value: "Qwen/Qwen2.5-7B-Instruct"
      volumeMounts:
        - {name: scratch, mountPath: /scratch}
  containers:
    - name: holder
      image: __IMAGE__
      args: ["--role", "holder", "--name", "holder", "--dir", "/scratch/model", "--nixl-port", "7000", "--buf-gib", "4"]
      env:
        - {name: RUST_LOG, value: "info"}
      resources:
        limits:
          rdma/ib: 1
          cpu: "8"
          memory: 24Gi
      volumeMounts:
        - {name: scratch, mountPath: /scratch}
  volumes:
    - name: scratch
      emptyDir: {}
