# Self-contained, istio-free namespace for the cache self-heal harness.
#
# weaton-dev enforces STRICT mTLS on the registry, but the cache daemon must run
# out-of-mesh for RDMA, so it cannot reach a meshed server. This namespace has no
# istio-injection label (so no sidecars), its own ServiceAccount + RBAC, and its
# own ModelMetadata CRs -- nothing touches the production server. The nvcr image
# pull secret is copied in separately (it holds credentials, not templated here).
apiVersion: v1
kind: Namespace
metadata:
  name: mx-selfheal
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: modelexpress
  namespace: mx-selfheal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: modelexpress-metadata
  namespace: mx-selfheal
rules:
  - apiGroups: ["modelexpress.nvidia.com"]
    resources: ["modelmetadatas", "modelcacheentries"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["modelexpress.nvidia.com"]
    resources: ["modelmetadatas/status", "modelcacheentries/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: modelexpress-metadata
  namespace: mx-selfheal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: modelexpress-metadata
subjects:
  - kind: ServiceAccount
    name: modelexpress
    namespace: mx-selfheal
---
# Bind the namespace SA to the existing cluster-wide CRD-reader role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: modelexpress-crd-reader-mx-selfheal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: modelexpress-crd-reader
subjects:
  - kind: ServiceAccount
    name: modelexpress
    namespace: mx-selfheal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelexpress-server
  namespace: mx-selfheal
  labels: {app: modelexpress-server}
spec:
  replicas: 1
  selector: {matchLabels: {app: modelexpress-server}}
  template:
    metadata:
      labels: {app: modelexpress-server}
    spec:
      serviceAccountName: modelexpress
      imagePullSecrets:
        - name: nvcr-imagepullsecret
      containers:
        - name: modelexpress-server
          image: nvcr.io/nvidia/ai-dynamo/modelexpress-server:0.3.0
          ports:
            - {containerPort: 8001, name: grpc}
          env:
            - {name: MX_METADATA_BACKEND, value: "kubernetes"}
            - {name: MX_METADATA_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: MODEL_EXPRESS_SERVER_PORT, value: "8001"}
            - {name: MODEL_EXPRESS_LOG_LEVEL, value: "info"}
          readinessProbe:
            tcpSocket: {port: 8001}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: modelexpress-server
  namespace: mx-selfheal
spec:
  selector: {app: modelexpress-server}
  ports:
    - {port: 8001, targetPort: 8001, name: grpc}
