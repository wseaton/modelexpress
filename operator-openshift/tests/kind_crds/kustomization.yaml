# The OpenShift and prometheus-operator APIs the operator expects, as bare CRDs,
# so a kind cluster can stand in for OpenShift.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- apiservers.config.openshift.io.crd.json
- servicemonitors.monitoring.coreos.com.crd.json
